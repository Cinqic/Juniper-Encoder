[build-system]
requires = []
build-backend = "build_backend"
backend-path = ["."]

[project]
name = "juniper-encoder"
version = "0.1.0"
description = "A deterministic, contract-first encoder for routing requests to registered capabilities."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }
authors = [{ name = "Cinqic" }]
dependencies = []

[project.optional-dependencies]
training = ["torch"]

[project.scripts]
juniper-encoder = "juniper_encoder.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
